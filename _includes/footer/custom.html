<!-- Subraya en el menú la sección que se está viendo -->
<script>
(function () {
  if (location.pathname !== "/" && location.pathname !== "/index.html") return;
  var items = Array.prototype.slice.call(document.querySelectorAll(".visible-links .masthead__menu-item"));
  var home = items[0];
  var map = [["proyectos", "#proyectos"], ["trabajo-de-campo", "#trabajo-de-campo"], ["publicaciones", "#publicaciones"], ["cv", "cv-brisa-cruz.pdf"]]
    .map(function (m) {
      var li = items.filter(function (i) { var a = i.querySelector("a"); return a && a.getAttribute("href") && a.getAttribute("href").indexOf(m[1]) !== -1; })[0];
      return { el: document.getElementById(m[0]), li: li };
    })
    .filter(function (m) { return m.el && m.li; });
  function update() {
    var current = home;
    map.forEach(function (m) { if (m.el.getBoundingClientRect().top < 140) current = m.li; });
    items.forEach(function (i) { i.classList.toggle("selected", i === current); });
  }
  window.addEventListener("scroll", update, { passive: true });
  update();
})();
</script>
